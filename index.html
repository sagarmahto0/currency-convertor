```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Currency Converter</h1>

        <p>Simple Currency Conversion</p>

        <div class="converter">

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                value="1"
                min="0"
                placeholder="Enter amount"
            >

            <div class="currency-box">

                <div class="currency-field">

                    <label for="fromCurrency">
                        From
                    </label>

                    <select id="fromCurrency">

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="INR">
                            INR - Indian Rupee
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                        <option value="JPY">
                            JPY - Japanese Yen
                        </option>

                        <option value="AUD">
                            AUD - Australian Dollar
                        </option>

                        <option value="CAD">
                            CAD - Canadian Dollar
                        </option>

                        <option value="CHF">
                            CHF - Swiss Franc
                        </option>

                        <option value="CNY">
                            CNY - Chinese Yuan
                        </option>

                        <option value="SGD">
                            SGD - Singapore Dollar
                        </option>

                    </select>

                </div>


                <button
                    type="button"
                    id="swap"
                >
                    ⇄
                </button>


                <div class="currency-field">

                    <label for="toCurrency">
                        To
                    </label>

                    <select id="toCurrency">

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="INR" selected>
                            INR - Indian Rupee
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                        <option value="JPY">
                            JPY - Japanese Yen
                        </option>

                        <option value="AUD">
                            AUD - Australian Dollar
                        </option>

                        <option value="CAD">
                            CAD - Canadian Dollar
                        </option>

                        <option value="CHF">
                            CHF - Swiss Franc
                        </option>

                        <option value="CNY">
                            CNY - Chinese Yuan
                        </option>

                        <option value="SGD">
                            SGD - Singapore Dollar
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="button"
                id="convert"
            >
                Convert
            </button>


            <div class="result">

                <h2 id="result">
                    Result
                </h2>

                <p id="rate"></p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
